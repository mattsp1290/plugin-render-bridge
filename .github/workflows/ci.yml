name: CI
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --all-targets --features testing
      - run: cargo test --locked --features testing
      - run: cargo clippy --locked --all-targets --features testing -- -D warnings
      - run: cargo doc --locked --no-deps --features testing
        env:
          RUSTDOCFLAGS: -D warnings
