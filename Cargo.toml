[package]
name = "plugin-render-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/mattsp1290/plugin-render-bridge"
description = "Offline note rendering with a crash-isolated child-process bridge"
include = ["src/**", "tests/**", "examples/**", "benches/**", "assets/**", "docs/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "THIRD-PARTY-NOTICES.md"]

[features]
default = []
testing = []

[dependencies]
plugin-hostkit = { git = "https://github.com/mattsp1290/plugin-hostkit", tag = "v0.1.0" }
hound = "3.5"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
tempfile = "3"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "plugin-renderer"
path = "src/bin/plugin_renderer.rs"


[[test]]
name = "buffer_tests"
required-features = ["testing"]

[[test]]
name = "wav_roundtrip_tests"
required-features = ["testing"]

[[test]]
name = "render_tests"
required-features = ["testing"]

[[test]]
name = "bridge_integration_tests"
required-features = ["testing"]

[[test]]
name = "vital_render_tests"
harness = false
required-features = ["testing"]

[[bench]]
name = "audio_benchmarks"
harness = false
required-features = ["testing"]
